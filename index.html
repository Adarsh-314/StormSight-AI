function StatusDot({tone="green", pulsing=true, size=8}){
  const colors = {green:"var(--safe-green)", amber:"var(--warn-amber)", red:"var(--danger-red)", gray:"var(--text-tertiary)"};
  return <span style={{
    display:"inline-block", width:size, height:size, borderRadius:"50%",
    background:colors[tone], boxShadow:`0 0 8px ${colors[tone]}66`
  }} className={pulsing?"pulse-dot":""}/>;
}

function Badge({children, tone="default"}){
  const map = {
    default:{bg:"var(--bg-panel-3)", fg:"var(--text-secondary)", bd:"var(--border)"},
    cyan:{bg:"rgba(61,214,224,0.1)", fg:"var(--accent-cyan)", bd:"rgba(61,214,224,0.3)"},
    amber:{bg:"var(--warn-amber-dim)", fg:"var(--warn-amber)", bd:"rgba(245,165,36,0.35)"},
    red:{bg:"var(--danger-red-dim)", fg:"var(--danger-red)", bd:"rgba(239,68,68,0.35)"},
    green:{bg:"var(--safe-green-dim)", fg:"var(--safe-green)", bd:"rgba(34,197,94,0.35)"},
  };
  const c = map[tone] || map.default;
  return (
    <span style={{
      background:c.bg, color:c.fg, border:`1px solid ${c.bd}`,
      borderRadius:999, padding:"3px 10px", fontSize:11.5, fontWeight:600,
      letterSpacing:.2, display:"inline-flex", alignItems:"center", gap:6, whiteSpace:"nowrap"
    }}>{children}</span>
  );
}

function categoryTone(catKey){
  const idx = catIndex(catKey);
  if(idx <= 1) return "default";
  if(idx <= 2) return "cyan";
  if(idx <= 4) return "amber";
  return "red";
}

function CategoryBadge({catKey}){
  const cat = IMD_SCALE.find(c=>c.key===catKey) || IMD_SCALE[0];
  return <Badge tone={categoryTone(catKey)}>{cat.label}</Badge>;
}

function ConfidenceMeter({value, size="md"}){
  const w = size==="sm" ? 46 : 60;

function fmtUTC(date){
  const p = n => String(n).padStart(2,"0");
  return `${p(date.getUTCHours())}:${p(date.getUTCMinutes())}:${p(date.getUTCSeconds())} UTC`;
}
function fmtTimeShort(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
}

/* =========================================================================
   MAP — custom schematic SVG projection of the North Indian Ocean basin
   ========================================================================= */
const MAP_BOUNDS = {latMin:0, latMax:26, lonMin:54, lonMax:100};
const MAP_W = 900, MAP_H = 620;
function project(lat, lon){
  const x = ((lon - MAP_BOUNDS.lonMin) / (MAP_BOUNDS.lonMax - MAP_BOUNDS.lonMin)) * MAP_W;
  const y = ((MAP_BOUNDS.latMax - lat) / (MAP_BOUNDS.latMax - MAP_BOUNDS.latMin)) * MAP_H;
  return [x,y];
}
function pathFromLatLon(points, close=true){
  const d = points.map((p,i)=>{
    const [x,y] = project(p[0], p[1]);
    return `${i===0?"M":"L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return close ? d + " Z" : d;
}

function StormTrackOnMap({storm}){
  const hist = storm.historicalTrack.map(p=>[p.lat,p.lon]);
  const fc = [[storm.position.lat, storm.position.lon], ...storm.forecastTrack.map(p=>[p.lat,p.lon])];
  const histPath = hist.map((p,i)=>{ const [x,y]=project(p[0],p[1]); return `${i===0?"M":"L"}${x},${y}`;}).join(" ");
  const fcPath = fc.map((p,i)=>{ const [x,y]=project(p[0],p[1]); return `${i===0?"M":"L"}${x},${y}`;}).join(" ");
  // uncertainty cone polygon
  const uncertPts = [];
  storm.forecastTrack.forEach((p,i)=>{
    const kmPerDegLat = 111;
    const dLat = (storm.uncertaintyKm[i]/kmPerDegLat);
    uncertPts.push([p.lat+dLat, p.lon]);
  });
  const uncertPtsBack = [];
  storm.forecastTrack.slice().reverse().forEach((p,i)=>{
    const idx = storm.forecastTrack.length-1-i;
    const kmPerDegLat = 111;
    const dLat = (storm.uncertaintyKm[idx]/kmPerDegLat);
    uncertPtsBack.push([p.lat-dLat, p.lon]);
  });
  const conePts = [[storm.position.lat, storm.position.lon], ...uncertPts, ...uncertPtsBack];
  const conePath = pathFromLatLon(conePts, true);
  return (
    <g>
      <path d={conePath} fill="var(--accent-cyan)" opacity="0.08" stroke="var(--accent-cyan)" strokeOpacity="0.25" strokeWidth="1"/>
      <path d={histPath} fill="none" stroke="#8B96A5" strokeWidth="2"/>
      <path d={fcPath} fill="none" stroke="var(--accent-cyan)" strokeWidth="2" strokeDasharray="6 5"/>
      {storm.forecastTrack.map((p,i)=>{
        const [x,y] = project(p.lat,p.lon);
        return (
          <g key={i} transform={`translate(${x},${y})`}>
            <circle r="4" fill="#0A0E14" stroke="var(--accent-cyan)" strokeWidth="2"/>
            <text x="8" y="-6" fontSize="10" fontFamily="JetBrains Mono, monospace" fill="var(--accent-cyan)">+{p.h}h</text>
          </g>
        );
      })}
    </g>
  );
}

/* =========================================================================
   CHART.JS WRAPPER — intensity forecast / historical comparison
   ========================================================================= */
function LineChartCanvas({datasets, labels, height=260, yLabel="Wind speed (km/h)"}){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!canvasRef.current) return;
    if(chartRef.current) chartRef.current.destroy();
    const ctx = canvasRef.current.getContext("2d");
    chartRef.current = new Chart(ctx, {
      type:"line",
      data:{ labels, datasets },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:"index", intersect:false},
        plugins:{
          legend:{ labels:{ color:"#8B96A5", font:{family:"Inter", size:11}, usePointStyle:true, boxWidth:8 } },
          tooltip:{
            backgroundColor:"#151C27", borderColor:"#232C3A", borderWidth:1,
            titleColor:"#E8ECF1", bodyColor:"#B7C0CC", padding:10, titleFont:{family:"Space Grotesk"}, bodyFont:{family:"JetBrains Mono", size:11.5}
          }
        },
        scales:{
          x:{ ticks:{color:"#5B6576", font:{family:"JetBrains Mono", size:11}}, grid:{color:"#1B2330"} },
          y:{ ticks:{color:"#5B6576", font:{family:"JetBrains Mono", size:11}}, grid:{color:"#1B2330"},
              title:{display:true, text:yLabel, color:"#5B6576", font:{family:"Inter", size:11}} }
        }
      }
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(datasets), JSON.stringify(labels)]);
  return <div style={{height}}><canvas ref={canvasRef}/></div>;
}

function DashboardPage({storms, alerts, selectedId, setSelectedId, goForecast}){
  const active = storms.filter(s=>s.status==="active").length;

  const severe = storms.filter(s=>catIndex(s.category) >= 4).length;
  const activeWarnings = alerts.filter(a=>a.severity==="WARNING").length;
  const avgConfidence = storms.length ? (storms.reduce((a,s)=>a+s.confidence,0)/storms.length) : 0;
  const selected = storms.find(s=>s.id===selectedId) || storms[0];

  if(storms.length===0){
    return <EmptyState title="No active storms detected" body="StormSight-AI is continuously monitoring the North Indian Ocean. New disturbances will appear here automatically."/>;
  }

  return (
    <div style={{display:"flex", flexDirection:"column", gap:20}}>

      </div>

      <div style={{display:"grid", gridTemplateColumns:"minmax(0,2fr) minmax(280px,1fr)", gap:16}} className="dash-grid">
        <Panel title="Live Cyclone Map" subtitle="Tap a marker to inspect a system" right={<Badge tone="cyan">{storms.length} systems tracked</Badge>}>

function SatelliteMockVisual({channel}){
  // stylised synthetic "satellite" render — swirl pattern via layered radial gradients, purely decorative demo data
  const palettes = {
    ir:["#0b1420","#1c3a4a","#3dd6e0"],
    vis:["#12141a","#3a4250","#c9d3de"],
    wv:["#0d1a1f","#1f4a52","#5fd6c8"],
    mw:["#160e1c","#3a2050","#c060f0"],
    scat:["#0e1420","#204060","#4c8dff"],
    combined:["#101018","#2a2a40","#f5a524"],
  };
  const [c1,c2,c3] = palettes[channel] || palettes.ir;
  return (
    <svg viewBox="0 0 800 440" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id={`g1-${channel}`} cx="55%" cy="45%" r="55%">
          <stop offset="0%" stopColor={c3} stopOpacity="0.9"/>
          <stop offset="45%" stopColor={c2} stopOpacity="0.7"/>
          <stop offset="100%" stopColor={c1} stopOpacity="1"/>
        </radialGradient>
      </defs>
      <rect width="800" height="440" fill={c1}/>
      <rect width="800" height="440" fill={`url(#g1-${channel})`}/>
      {Array.from({length:5}).map((_,i)=>(
        <path key={i} d={`M ${100+i*40} 440 C ${300+i*30} ${250-i*20}, ${420-i*20} ${180+i*10}, ${440} 40`}
          fill="none" stroke={c3} strokeOpacity={0.12+i*0.04} strokeWidth={18-i*2}/>
      ))}
      <circle cx="440" cy="200" r="6" fill="#fff" opacity="0.85"/>
    </svg>
  );
}

/* =========================================================================
   PAGE: HISTORICAL REPLAY
   ========================================================================= */
function HistoricalReplayPage(){
  const track = HISTORICAL_REPLAY_STORM.track;
  const [idx, setIdx] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(1);

  useEffect(()=>{
    if(!playing) return;
    const t = setInterval(()=>{
      setIdx(i => (i >= track.length-1 ? 0 : i+1));
    }, 1200/speed);
    return ()=>clearInterval(t);
  }, [playing, speed]);

  const current = track[idx];
  const asStorm = {
    id: HISTORICAL_REPLAY_STORM.id, name: HISTORICAL_REPLAY_STORM.name,
    position:{lat:current.lat, lon:current.lon}, category: current.category,
    historicalTrack: track.slice(0, idx+1).map(p=>({lat:p.lat, lon:p.lon, t:p.t})),
    forecastTrack: [], uncertaintyKm:[]
  };

  return (
    <div style={{display:"flex", flexDirection:"column", gap:16}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
        <div>
          <div className="display" style={{fontSize:20, fontWeight:700}}>Historical Replay</div>
          <div style={{fontSize:12.5, color:"var(--text-secondary)", marginTop:2}}>Review previous storm tracks and how the model's predictions compared to what happened</div>
        </div>
        <DemoTag/>
      </div>

      <div style={{display:"flex", gap:12, flexWrap:"wrap", alignItems:"center"}}>
        <select style={{background:"var(--bg-panel-2)", border:"1px solid var(--border)", color:"var(--text-primary)", borderRadius:8, padding:"9px 12px", fontSize:13}}>
          <option>{HISTORICAL_REPLAY_STORM.name} — {HISTORICAL_REPLAY_STORM.id}</option>
        </select>
        <input type="date" defaultValue="2025-11-01" style={{background:"var(--bg-panel-2)", border:"1px solid var(--border)", color:"var(--text-primary)", borderRadius:8, padding:"8px 12px", fontSize:13}}/>
      </div>

      <Panel bodyStyle={{padding:0}}>
        <div style={{padding:20}}>
          <CycloneMap storms={[asStorm]} selectedId={asStorm.id} onSelect={()=>{}} showTracks={false} height={440}/>
        </div>
        <div style={{borderTop:"1px solid var(--border-soft)", padding:"16px 20px", display:"flex", alignItems:"center", gap:16, flexWrap:"wrap"}}>
          <button onClick={()=>setPlaying(p=>!p)} style={{
            width:40, height:40, borderRadius:"50%", background:"var(--accent-cyan)", border:"none", color:"#04141a",
            display:"flex", alignItems:"center", justifyContent:"center"
          }}><IconBtn name={playing?"pause":"play"} size={18} fill="#04141a"/></button>
          <input type="range" min="0" max={track.length-1} value={idx} onChange={e=>setIdx(Number(e.target.value))} style={{flex:1, minWidth:160, accentColor:"#3DD6E0"}}/>
          <span className="mono" style={{fontSize:12, color:"var(--text-secondary)", minWidth:110}}>{current.t}</span>
          <select value={speed} onChange={e=>setSpeed(Number(e.target.value))} style={{background:"var(--bg-panel-2)", border:"1px solid var(--border)", color:"var(--text-primary)", borderRadius:8, padding:"6px 10px", fontSize:12.5}}>
            <option value={0.5}>0.5×</option>
            <option value={1}>1×</option>
            <option value={2}>2×</option>
            <option value={4}>4×</option>
          </select>
        </div>
      </Panel>

      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:14}}>
        <Metric icon="wind" label="Observed Intensity" value={`${current.obsWind} km/h`}/>
        <Metric icon="model" label="Predicted Intensity (at time)" value={current.predWind ? `${current.predWind} km/h` : "—"}/>
        <Metric icon="target" label="Category (observed)" value={IMD_SCALE.find(c=>c.key===current.category)?.label}/>
        <Metric icon="clock" label="Timestamp" value={current.t}/>
      </div>

      <Panel title="Observed vs. AI-Predicted Intensity" subtitle="Full event timeline">
        <LineChartCanvas
          labels={track.map(t=>t.t.split(",")[0])}
          datasets={[
            {label:"Observed", data:track.map(t=>t.obsWind), borderColor:"#8B96A5", backgroundColor:"transparent", tension:.3, pointRadius:2},
            {label:"AI Predicted", data:track.map(t=>t.predWind), borderColor:"#3DD6E0", backgroundColor:"transparent", borderDash:[6,4], tension:.3, pointRadius:2},
          ]}
        />
      </Panel>
      <DisclaimerBar/>
    </div>
  );
}

/* =========================================================================
   PAGE: STORM DATABASE
   ========================================================================= */
function StormDatabasePage(){
  const [query, setQuery] = useState("");
  const [basinFilter, setBasinFilter] = useState("ALL");
  const [sortKey, setSortKey] = useState("date");
  const [sortDir, setSortDir] = useState("desc");
  const [page, setPage] = useState(1);
  const [selected, setSelected] = useState(null);
  const pageSize = 5;

  let rows = HISTORICAL_STORMS.filter(r =>
    (basinFilter==="ALL" || r.basin===basinFilter) &&
    (r.name.toLowerCase().includes(query.toLowerCase()) || r.id.toLowerCase().includes(query.toLowerCase()))
  );
  rows = rows.sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(sortKey==="maxWind"){ av=a.maxWind; bv=b.maxWind; }
    if(av<bv) return sortDir==="asc"?-1:1;
    if(av>bv) return sortDir==="asc"?1:-1;
    return 0;
  });
  const totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
  const pageRows = rows.slice((page-1)*pageSize, page*pageSize);

  const toggleSort = (key)=>{
    if(sortKey===key) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortKey(key); setSortDir("desc"); }
  };

  if(selected){
    return <StormProfilePage storm={selected} onBack={()=>setSelected(null)}/>;
  }

  return (
    <div style={{display:"flex", flexDirection:"column", gap:16}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
        <div className="display" style={{fontSize:20, fontWeight:700}}>Storm Database</div>
        <DemoTag/>
      </div>
      <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
        <div style={{position:"relative", flex:"1 1 240px"}}>
          <span style={{position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:"var(--text-tertiary)"}}><IconBtn name="search" size={15}/></span>
          <input value={query} onChange={e=>{setQuery(e.target.value); setPage(1);}} placeholder="Search by storm name or ID"
            style={{width:"100%", background:"var(--bg-panel-2)", border:"1px solid var(--border)", color:"var(--text-primary)", borderRadius:8, padding:"9px 12px 9px 34px", fontSize:13}}/>
        </div>
        <select value={basinFilter} onChange={e=>{setBasinFilter(e.target.value); setPage(1);}} style={{background:"var(--bg-panel-2)", border:"1px solid var(--border)", color:"var(--text-primary)", borderRadius:8, padding:"9px 12px", fontSize:13}}>
          <option value="ALL">All basins</option>
          <option value="Bay of Bengal">Bay of Bengal</option>
          <option value="Arabian Sea">Arabian Sea</option>
        </select>
      </div>

      <Panel bodyStyle={{padding:0}}>
        <div className="scroll-thin" style={{overflowX:"auto"}}>
          <table style={{width:"100%", fontSize:13}}>
            <thead>
              <tr style={{borderBottom:"1px solid var(--border-soft)", textAlign:"left"}}>
                {[["id","Storm ID"],["name","Name"],["date","Date"],["basin","Basin"],["maxCategory","Max Intensity"],["maxWind","Max Wind"],["minPressure","Min Pressure"],["duration","Duration"],["status","Status"]].map(([k,l])=>(
                  <th key={k} onClick={()=>toggleSort(k)} style={{padding:"12px 16px", color:"var(--text-tertiary)", fontWeight:600, fontSize:11.5, letterSpacing:.3, cursor:"pointer", whiteSpace:"nowrap"}}>
                    {l} {sortKey===k && (sortDir==="asc"?"↑":"↓")}
                  </th>
                ))}
                <th></th>
              </tr>
            </thead>
            <tbody>
              {pageRows.map(r=>(
                <tr key={r.id} onClick={()=>setSelected(r)} style={{borderBottom:"1px solid var(--border-soft)", cursor:"pointer"}}
                  onMouseEnter={e=>e.currentTarget.style.background="var(--bg-panel-2)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <td className="mono" style={{padding:"12px 16px", color:"var(--text-tertiary)"}}>{r.id}</td>
                  <td style={{padding:"12px 16px", fontWeight:600}}>{r.name}</td>
                  <td className="mono" style={{padding:"12px 16px", color:"var(--text-secondary)"}}>{r.date}</td>
                  <td style={{padding:"12px 16px", color:"var(--text-secondary)"}}>{r.basin}</td>
                  <td style={{padding:"12px 16px"}}><CategoryBadge catKey={r.maxCategory}/></td>
                  <td className="mono" style={{padding:"12px 16px"}}>{r.maxWind} km/h</td>
                  <td className="mono" style={{padding:"12px 16px"}}>{r.minPressure} hPa</td>
                  <td className="mono" style={{padding:"12px 16px", color:"var(--text-secondary)"}}>{r.duration}</td>
                  <td style={{padding:"12px 16px"}}><Badge>{r.status}</Badge></td>
                  <td style={{padding:"12px 16px", color:"var(--text-tertiary)"}}><IconBtn name="chevronRight" size={14}/></td>
                </tr>
              ))}
              {pageRows.length===0 && (
                <tr><td colSpan={10} style={{padding:30, textAlign:"center", color:"var(--text-secondary)"}}>No storms match this search.</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 16px", borderTop:"1px solid var(--border-soft)"}}>
          <span style={{fontSize:12, color:"var(--text-tertiary)"}}>Page {page} of {totalPages} · {rows.length} results</span>
          <div style={{display:"flex", gap:6}}>
            <button disabled={page<=1} onClick={()=>setPage(p=>p-1)} style={{opacity:page<=1?0.4:1, background:"var(--bg-panel-2)", border:"1px solid var(--border)", borderRadius:8, padding:"6px 10px", color:"var(--text-secondary)"}}><IconBtn name="chevronLeft" size={14}/></button>
            <button disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)} style={{opacity:page>=totalPages?0.4:1, background:"var(--bg-panel-2)", border:"1px solid var(--border)", borderRadius:8, padding:"6px 10px", color:"var(--text-secondary)"}}><IconBtn name="chevronRight" size={14}/></button>
          </div>
        </div>
      </Panel>
    </div>
  );
}

/* =========================================================================
   APP SHELL / ROUTER
   ========================================================================= */
function AppShell(){
  const [route, setRoute] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [selectedId, setSelectedId] = useState(MOCK_STORMS[0].id);
  const [demoMode, setDemoMode] = useState(true);
  const [storms, setStorms] = useState([]);
  const [alerts, setAlerts] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    let mounted = true;
    Promise.all([api.getActiveStorms(), api.getAlerts()]).then(([s,a])=>{
      if(!mounted) return;
      setStorms(s); setAlerts(a); setLoading(false);
    });
    return ()=>{ mounted=false; };
  }, []);

  const goForecast = (id) => { setSelectedId(id); setRoute("forecast"); };

  let page;
  if(loading){
    page = (
      <div style={{display:"flex", alignItems:"center", justifyContent:"center", height:"60vh", color:"var(--text-secondary)", gap:10}}>
        <IconBtn name="refresh" size={18} className="spin"/> Loading live monitoring data…
      </div>
    );
  } else {
    switch(route){
      case "dashboard": page = <DashboardPage storms={storms} alerts={alerts} selectedId={selectedId} setSelectedId={setSelectedId} goForecast={goForecast}/>; break;
      case "live": page = <LiveStormsPage storms={storms} selectedId={selectedId} setSelectedId={setSelectedId} goForecast={goForecast}/>; break;
      case "forecast": page = <ForecastPage storms={storms} selectedId={selectedId} setSelectedId={setSelectedId}/>; break;
      case "satellite": page = <SatellitePage/>; break;
      case "alerts": page = <AlertsPage alerts={alerts}/>; break;
      case "replay": page = <HistoricalReplayPage/>; break;
      case "database": page = <StormDatabasePage/>; break;
      case "model": page = <ModelIntelligencePage/>; break;
      case "status": page = <SystemStatusPage/>; break;
      case "settings": page = <SettingsPage demoMode={demoMode} setDemoMode={setDemoMode}/>; break;
      default: page = null;
    }
  }

  const activeWarnings = alerts.filter(a=>a.severity==="WARNING").length;

  return (
    <div style={{display:"flex", minHeight:"100vh"}}>
      <Sidebar route={route} setRoute={setRoute} collapsed={collapsed} setCollapsed={setCollapsed}
        mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} alertCount={activeWarnings}/>
      <div style={{flex:1, minWidth:0, display:"flex", flexDirection:"column"}}>
        <Header setMobileOpen={setMobileOpen} alertCount={activeWarnings} route={route}/>
        <main style={{padding:"22px", flex:1}}>
          {demoMode && (
            <div style={{marginBottom:16, display:"flex", alignItems:"center", gap:8}}>
              <DemoTag/>
              <span style={{fontSize:11.5, color:"var(--text-tertiary)"}}>Live backend not connected — showing synthetic demonstration data.</span>
            </div>
          )}
          {page}
        </main>
      </div>
    </div>
  );
}

function Root(){
  const [entered, setEntered] = useState(false);
  if(!entered) return <LandingPage onEnter={()=>setEntered(true)}/>;
  return <AppShell/>;
}

/* Minimal responsive helpers injected as a stylesheet (Tailwind CDN not required; hand-rolled utility classes used above are plain inline styles) */
const styleTag = document.createElement("style");
styleTag.innerHTML = `
  @media (max-width: 767px){
    .hidden.md\\:flex{ display:none !important; }
  }
  @media (min-width: 768px){
    .md\\:hidden{ display:none !important; }
  }
  @media (max-width: 900px){
    .dash-grid{ grid-template-columns: 1fr !important; }
  }
`;
document.head.appendChild(styleTag);

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
